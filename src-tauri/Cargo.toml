[package]
name = "x-note"
version = "0.2.5"
description = "X-Note 笔记 - 本地优先的 Markdown 笔记软件"
authors = ["XFM <https://www.lovou.pw>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
